name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: UI geometry probe
        run: |
          NICKEL_UI_PROBE=1 timeout 120 .build/debug/Nickel

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Must match the app's OS floor (macOS 26): the SwiftUI APIs it uses
    # (glassEffect etc.) don't exist in older runners' SDKs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # Offscreen row-geometry checks (heights, hit-testing, reveal) that
      # swift test can't cover. timeout-minutes guards a hung runloop —
      # macOS runners have no GNU `timeout` binary.
      - name: UI geometry probe
        timeout-minutes: 5
        run: NICKEL_UI_PROBE=1 .build/debug/Nickel
